# Проверки на каждый pull request.
#
# ДЖОБЫ ИДУТ ПАРАЛЛЕЛЬНО, и это главное в этом файле: общее время равно
# самому долгому шагу, а не их сумме. Раньше всё висело в двух джобах,
# и типы ждали, пока досчитается одиннадцатиминутная матрица баланса.
#
# Два самых дорогих набора запускаются НЕ ВСЕГДА:
#   visual  — только если тронут экран (ui, render3d, App.svelte, стили);
#   balance — только если тронуты данные или логика (data/, game/).
# Оба можно включить принудительно меткой `full-checks` на PR — это нужно,
# когда правка выглядит безобидной, а трогает то, о чём фильтр не знает.
name: CI

on:
  # labeled/unlabeled обязательны: без них метка `full-checks` не делала бы
  # ничего до следующего пуша, а перезапуск джоба повторяет СТАРОЕ событие,
  # в котором метки ещё не было.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # НА main ТОЖЕ. Раньше результат merge не проверялся ничем до ночного
  # прогона: PR был зелёным поодиночке, а слитый в main мог быть красным —
  # и узнавали об этом через сутки. У пуша нет базы для сравнения, поэтому
  # джоб changes включает всё (см. ветку «базы нет» ниже).
  push:
    branches: [main]
  workflow_dispatch:

# Один PR — один живой прогон. Новый коммит отменяет предыдущий: раннеры
# освобождаются сразу, и свежий коммит не стоит в очереди за устаревшим.
# Отменяется при этом ПРОШЛЫЙ коммит, а не текущий: то, что отменили,
# уже никого не интересует, а снимки нового прогона всё равно уедут.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Что вообще тронуто в этом PR. Один дешёвый джоб решает за всех
  # остальных: без него каждый считал бы диапазон коммитов сам.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      logic: ${{ steps.filter.outputs.logic }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Что изменилось
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -eu
          # push в main и workflow_dispatch: базы для сравнения нет — гоняем всё.
          if [ -z "${BASE:-}" ]; then
            echo "ui=true"   >> "$GITHUB_OUTPUT"
            echo "logic=true" >> "$GITHUB_OUTPUT"
            echo "full=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only "$BASE" "$HEAD")
          echo "Тронуто файлов: $(echo "$FILES" | wc -l)"
          echo "$FILES"
          # Метка на PR перебивает фильтры: «прогони всё, я не уверен».
          case ",$LABELS," in *,full-checks,*) FULL=true ;; *) FULL=false ;; esac
          match() { echo "$FILES" | grep -qE "$1" && echo true || echo false; }
          # ПРЕСЕТЫ И ДАННЫЕ — ТОЖЕ ЭКРАН. Пресеты для съёмки собираются
          # настоящими функциями игры, поэтому правка чисел в data/ меняет то,
          # что видно на снимке: золото, опыт, урон в логе. Раньше их здесь не
          # было, и эталоны тихо расходились с игрой — а всплывало это через
          # три PR, на чужой правке, четырьмя посторонними диффами сразу.
          UI=$(match '^(src/lib/ui/|src/lib/render3d/|src/App\.svelte|src/app\.css|tests/|src/lib/data/|src/lib/game/__fixtures__/presets/)')
          LOGIC=$(match '^(src/lib/data/|src/lib/game/)')
          [ "$FULL" = true ] && UI=true && LOGIC=true
          echo "ui=$UI"       >> "$GITHUB_OUTPUT"
          echo "logic=$LOGIC" >> "$GITHUB_OUTPUT"
          echo "full=$FULL"   >> "$GITHUB_OUTPUT"
          echo "Итог: ui=$UI logic=$LOGIC full=$FULL"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run check

  # СБОРКА. БЕЗ ФИЛЬТРА ПУТЕЙ, и это принципиально.
  #
  # Раньше сборка встречалась только внутри visual, а visual идёт по фильтру
  # экрана. PR, который трогал только src/lib/game/ или src/lib/data/, не
  # собирался НИ РАЗУ: впервые это пытался сделать deploy.yml — уже на main,
  # после merge. Падал он там молча для игрока: GitHub Pages продолжает
  # отдавать ПРЕДЫДУЩУЮ сборку, сайт работает, новой фичи нет, и увидеть
  # причину можно только во вкладке Actions.
  #
  # `npm run check` этого не заменяет: svelte-check и tsc проверяют типы,
  # а бандл не собирают.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Сборка
        run: npm run build

      # ТРИ ГРУЗИТСЯ ДИНАМИЧЕСКИ — теперь это правило, а не привычка.
      # Единственный await import('three') живёт в Scene3D.svelte; заменить
      # его на обычный импорт можно было, не уронив ни одного теста, и
      # библиотека весом больше самой игры поехала бы в основной кусок —
      # включая тех, у кого текстовый режим и у кого нет WebGL.
      - name: three лежит отдельным куском, основной чанк в пределах порога
        run: |
          set -eu
          # Порог с ЗАПАСОМ: игра растёт, и джоб не должен краснеть от каждой
          # новой панели. Он ловит не рост на проценты, а въезд библиотеки
          # размером с игру: three весит ~724 кБ, и с ним основной кусок
          # сразу уходит за 1.3 МБ.
          LIMIT=900000

          THREE=$(ls dist/assets/three.module-*.js 2>/dev/null | head -n1 || true)
          if [ -z "$THREE" ]; then
            echo "::error::three не выделен отдельным куском — значит, он уехал в основной бандл."
            echo "Содержимое dist/assets:"; ls -l dist/assets
            exit 1
          fi
          echo "three отдельным куском: $THREE ($(stat -c%s "$THREE") Б)"

          # Точка входа берётся ИЗ index.html, а не угадывается по имени файла:
          # хеш в имени меняется каждой сборкой, а ссылка в разметке — нет.
          ENTRY=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -n1)
          if [ -z "$ENTRY" ]; then
            echo "::error::не нашёл точку входа в dist/index.html"; exit 1
          fi
          SIZE=$(stat -c%s "dist/$ENTRY")
          echo "основной кусок: $ENTRY ($SIZE Б, порог $LIMIT Б)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::основной кусок $SIZE Б больше порога $LIMIT Б — проверь, не уехала ли в него библиотека."
            ls -l dist/assets
            exit 1
          fi

  # Юниты и golden. Матрицы прогонов здесь нет — она в balance.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Юниты и golden
        run: npx vitest run --exclude "src/lib/game/__tests__/balance.test.ts" --exclude "src/lib/game/__tests__/run.test.ts"

  # Отдельным джобом ради ИМЕНИ: сломанная ссылка в data/ видна по названию
  # проверки, а не поиском по логу тестов.
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run content:check

  # ВЫБОРКА, а не полная матрица: три зоны, два уровня, один класс. Пороги и
  # ассерты те же — сужен охват. Полная матрица идёт ночью (nightly.yml) и по
  # метке full-checks; перед PR, который правит кривые, её гоняют локально.
  balance:
    needs: changes
    if: needs.changes.outputs.logic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Прогон баланса (выборка)
        if: needs.changes.outputs.full != 'true'
        run: npm run test:balance:sample
      - name: Прогон баланса (полная матрица)
        if: needs.changes.outputs.full == 'true'
        run: npm run test:balance

  # Визуальная регрессия: собирает игру и снимает заранее заданные состояния
  # в двух режимах — интерфейс без сцены (сравнивается с эталонами) и экран
  # со сценой (только на посмотреть). ОБА комплекта уходят артефактом при
  # любом исходе: смысл этой работы в том, чтобы посмотреть игру ДО merge,
  # а не после, и оптимизация не имеет права этого отнять.
  visual:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - name: Скриншоты
        run: npm run test:visual
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            test-results/current
            tests/screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-diff-report
          path: |
            playwright-report
            test-results
          retention-days: 14
