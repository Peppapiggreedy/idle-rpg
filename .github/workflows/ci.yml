# Проверки на каждый pull request: типы + тесты.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Tests
        run: npm run test

  # Визуальная регрессия: собирает игру, снимает заранее заданные состояния
  # и сравнивает с эталонами. Скриншоты уходят артефактом при любом исходе —
  # смысл этой работы в том, чтобы посмотреть игру ДО merge, а не после.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Браузер кладём в кеш и переиспользуем: качается он один раз на
      # версию @playwright/test, а не на каждый прогон. Версия закреплена
      # точно — от неё зависит отрисовка, а значит и эталоны.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: System libraries for cached Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Screenshots
        run: npm run screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            test-results/current
            tests/screenshots
          if-no-files-found: warn
          retention-days: 14
      # Отчёт с картинками «эталон / получилось / разница» — нужен, только
      # когда что-то разошлось.
      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-diff-report
          path: |
            playwright-report
            test-results
          retention-days: 14
