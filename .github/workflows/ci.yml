# Проверки на каждый pull request.
#
# ДЖОБЫ ИДУТ ПАРАЛЛЕЛЬНО, и это главное в этом файле: общее время равно
# самому долгому шагу, а не их сумме. Раньше всё висело в двух джобах,
# и типы ждали, пока досчитается одиннадцатиминутная матрица баланса.
#
# Два самых дорогих набора запускаются НЕ ВСЕГДА:
#   visual  — только если тронут экран (ui, render3d, App.svelte, стили);
#   balance — только если тронуты данные или логика (data/, game/).
# Оба можно включить принудительно меткой `full-checks` на PR — это нужно,
# когда правка выглядит безобидной, а трогает то, о чём фильтр не знает.
name: CI

on:
  # labeled/unlabeled обязательны: без них метка `full-checks` не делала бы
  # ничего до следующего пуша, а перезапуск джоба повторяет СТАРОЕ событие,
  # в котором метки ещё не было.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  # Что вообще тронуто в этом PR. Один дешёвый джоб решает за всех
  # остальных: без него каждый считал бы диапазон коммитов сам.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      logic: ${{ steps.filter.outputs.logic }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Что изменилось
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -eu
          # workflow_dispatch: базы для сравнения нет — гоняем всё.
          if [ -z "${BASE:-}" ]; then
            echo "ui=true"   >> "$GITHUB_OUTPUT"
            echo "logic=true" >> "$GITHUB_OUTPUT"
            echo "full=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only "$BASE" "$HEAD")
          echo "Тронуто файлов: $(echo "$FILES" | wc -l)"
          echo "$FILES"
          # Метка на PR перебивает фильтры: «прогони всё, я не уверен».
          case ",$LABELS," in *,full-checks,*) FULL=true ;; *) FULL=false ;; esac
          match() { echo "$FILES" | grep -qE "$1" && echo true || echo false; }
          UI=$(match '^(src/lib/ui/|src/lib/render3d/|src/App\.svelte|src/app\.css|tests/)')
          LOGIC=$(match '^(src/lib/data/|src/lib/game/)')
          [ "$FULL" = true ] && UI=true && LOGIC=true
          echo "ui=$UI"       >> "$GITHUB_OUTPUT"
          echo "logic=$LOGIC" >> "$GITHUB_OUTPUT"
          echo "full=$FULL"   >> "$GITHUB_OUTPUT"
          echo "Итог: ui=$UI logic=$LOGIC full=$FULL"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run check

  # Юниты и golden. Матрицы прогонов здесь нет — она в balance.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Юниты и golden
        run: npx vitest run --exclude "src/lib/game/__tests__/balance.test.ts" --exclude "src/lib/game/__tests__/run.test.ts"

  # Отдельным джобом ради ИМЕНИ: сломанная ссылка в data/ видна по названию
  # проверки, а не поиском по логу тестов.
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run content:check

  # ВЫБОРКА, а не полная матрица: три зоны, два уровня, один класс. Пороги и
  # ассерты те же — сужен охват. Полная матрица идёт ночью (nightly.yml) и по
  # метке full-checks; перед PR, который правит кривые, её гоняют локально.
  balance:
    needs: changes
    if: needs.changes.outputs.logic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Прогон баланса (выборка)
        if: needs.changes.outputs.full != 'true'
        run: npm run test:balance:sample
      - name: Прогон баланса (полная матрица)
        if: needs.changes.outputs.full == 'true'
        run: npm run test:balance

  # Визуальная регрессия: собирает игру и снимает заранее заданные состояния
  # в двух режимах — интерфейс без сцены (сравнивается с эталонами) и экран
  # со сценой (только на посмотреть). ОБА комплекта уходят артефактом при
  # любом исходе: смысл этой работы в том, чтобы посмотреть игру ДО merge,
  # а не после, и оптимизация не имеет права этого отнять.
  visual:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - name: Скриншоты
        run: npm run test:visual
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            test-results/current
            tests/screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-diff-report
          path: |
            playwright-report
            test-results
          retention-days: 14
